# Configuración de build para Railway (Nixpacks)
[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring",
           "php83Extensions.xml", "php83Extensions.tokenizer",
           "php83Extensions.ctype", "php83Extensions.curl",
           "php83Extensions.fileinfo", "php83Extensions.gd",
           "php83Extensions.openssl", "composer"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
